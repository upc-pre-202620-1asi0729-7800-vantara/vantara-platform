# Development environment.
# Override any value with environment variables; never commit real credentials.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/vantara_platform?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# Local-only JWT secret and logged verification codes so the app runs from the IDE without extra setup.
# JWT_SECRET / NOTIFICATIONS_EMAIL_LOG_CODES still override these values.
authorization.jwt.secret=${JWT_SECRET:vantara-local-dev-secret-change-me-0123456789}
notifications.email.log-codes=${NOTIFICATIONS_EMAIL_LOG_CODES:true}
