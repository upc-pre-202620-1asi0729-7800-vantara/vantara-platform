# Persistence tests run on in-memory H2 in MySQL mode; Hibernate builds the schema.
spring.datasource.url=jdbc:h2:mem:vantara;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
authorization.jwt.secret=test-secret-test-secret-test-secret-123456
authorization.jwt.expiration.days=1
